<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d2926">
    <meta
      name="description"
      content="中华人民共和国注册会计师法（2026年修正）可翻页电子书"
    >
    <title>中华人民共和国注册会计师法（2026年修正）</title>
    <link rel="stylesheet" href="vendor/page-flip.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">法</span>
          <div class="brand-copy">
            <strong id="book-title">中华人民共和国注册会计师法</strong>
            <span id="book-edition">法规阅读本 · 2026年修正</span>
          </div>
        </div>

        <div class="topbar-actions" role="toolbar" aria-label="阅读工具">
          <button class="tool-button" id="open-contents" type="button" aria-label="打开目录">
            <i data-lucide="list-tree" aria-hidden="true"></i>
            <span>目录</span>
          </button>
          <button
            class="icon-button"
            id="toggle-fullscreen"
            type="button"
            aria-label="进入全屏"
            data-tooltip="全屏"
          >
            <i data-lucide="maximize" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main class="reading-room" id="reading-room">
        <div class="book-zone">
          <div class="book-frame" id="book-frame">
            <div class="cover-entry" id="cover-entry">
              <button
                class="cover-object"
                id="open-cover"
                type="button"
                aria-label="翻开法规电子书"
              >
                <img id="cover-image" src="assets/pages/page-01.webp" alt="法规电子书封面">
                <span class="cover-open-cue">
                  <i data-lucide="book-open" aria-hidden="true"></i>
                  <span>翻开</span>
                </span>
              </button>
            </div>
            <div
              id="book"
              class="book"
              aria-label="中华人民共和国注册会计师法可翻页电子书"
            ></div>
            <div class="book-gutter" id="book-gutter" aria-hidden="true"></div>
          </div>
          <div class="loading-state" id="loading-state" role="status">
            <span class="loading-rule" aria-hidden="true"></span>
            <span>正在打开书籍</span>
          </div>
        </div>

        <button
          class="nav-arrow nav-arrow-left"
          id="previous-page"
          type="button"
          aria-label="上一页"
          data-tooltip="上一页"
        >
          <i data-lucide="chevron-left" aria-hidden="true"></i>
        </button>
        <button
          class="nav-arrow nav-arrow-right"
          id="next-page"
          type="button"
          aria-label="下一页"
          data-tooltip="下一页"
        >
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </button>
      </main>

      <footer class="reader-footer">
        <div class="mobile-navigation">
          <button class="icon-button" id="previous-page-mobile" type="button" aria-label="上一页">
            <i data-lucide="chevron-left" aria-hidden="true"></i>
          </button>
        </div>

        <div class="reading-status">
          <span id="current-location" aria-live="polite">封面</span>
          <div class="progress-cluster">
            <div
              class="reading-progress"
              id="reading-progress"
              role="progressbar"
              aria-label="阅读进度"
              aria-valuemin="1"
              aria-valuemax="23"
              aria-valuenow="1"
            >
              <span id="reading-progress-bar"></span>
            </div>
            <span class="page-number" id="page-number">1 / 23</span>
          </div>
        </div>

        <div class="footer-meta">
          <span>据所附文本排版</span>
          <button class="icon-button" id="next-page-mobile" type="button" aria-label="下一页">
            <i data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
        </div>
      </footer>
    </div>

    <div class="drawer-scrim" id="drawer-scrim" hidden></div>
    <aside
      class="contents-drawer"
      id="contents-drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="contents-title"
      aria-hidden="true"
      hidden
    >
      <div class="drawer-header">
        <div>
          <span class="drawer-eyebrow">CONTENTS</span>
          <h2 id="contents-title">目录</h2>
        </div>
        <button class="icon-button" id="close-contents" type="button" aria-label="关闭目录">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>

      <div class="drawer-scroll">
        <section class="front-matter" aria-label="前置内容">
          <div id="front-matter-list"></div>
        </section>

        <section class="chapter-list" aria-label="章节">
          <div id="chapter-list"></div>
        </section>
      </div>

      <div class="drawer-footer">
        <a class="pdf-link" id="pdf-link" href="#" target="_blank" rel="noreferrer">
          <i data-lucide="file-down" aria-hidden="true"></i>
          <span>打开 PDF 阅读本</span>
        </a>
      </div>
    </aside>

    <noscript>
      <p class="noscript-message">需要启用 JavaScript 才能翻阅电子书。</p>
    </noscript>

    <script src="vendor/page-flip.browser.js"></script>
    <script src="vendor/lucide.min.js"></script>
    <script src="book-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
